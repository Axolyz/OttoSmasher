# Windows 的构建与测试（DECISIONS §14：平时用云端机器跑）。
# 仓库是公开的：这里只用合成测试数据，不放真实素材，产物里也不能有（AGENTS §5）。
name: Windows

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 只跑这个端到端测试（例如 e2e/search.spec.ts），同时开卡死诊断；留空 = 全部
        required: false
        default: ""
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "tools/build_libmpv_macos.sh"
      - ".github/workflows/build-libmpv.yml"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ inputs.spec }}
  cancel-in-progress: true

jobs:
  core:
    if: ${{ !inputs.spec }}
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Python 环境
        run: tools/uv sync --locked
      - name: 第三方文件
        run: .venv/Scripts/python.exe tools/fetch_third_party.py
      - name: pydomino 扩展
        run: tools/uv run --with setuptools python tools/build_domino.py
      - name: 媒体工具加入 PATH
        run: |
          # GITHUB_PATH 要 Windows 格式的路径（bash 的 /d/a/... 原生程序不认）
          cygpath -w "$PWD/third_party/media-tools/ffmpeg/bin" >> "$GITHUB_PATH"
          cygpath -w "$PWD/third_party/media-tools/rubberband" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: dev-workspace/Models
          key: models-${{ hashFiles('core/ottosmasher/models/registry.py') }}
      - name: 模型权重
        run: .venv/Scripts/python.exe tools/fetch_models.py
      - name: Core 测试
        env:
          OTTO_STRICT_API: "1"
        run: .venv/Scripts/python.exe -m pytest core/tests --basetemp="$RUNNER_TEMP/pt" --junitxml=core-tests.xml -o junit_family=xunit1 --tb=short -rfE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-tests
          # 只有合成数据的日志（AGENTS §5）
          path: |
            core-tests.xml
            ${{ runner.temp }}/pt/**/log.txt
            ${{ runner.temp }}/pt/**/core.log
          if-no-files-found: ignore
          retention-days: 14

  app:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Python 环境
        run: tools/uv sync --locked
      - name: 第三方文件
        run: .venv/Scripts/python.exe tools/fetch_third_party.py
      - name: pydomino 扩展
        run: tools/uv run --with setuptools python tools/build_domino.py
      - name: 媒体工具加入 PATH
        run: |
          cygpath -w "$PWD/third_party/media-tools/ffmpeg/bin" >> "$GITHUB_PATH"
          cygpath -w "$PWD/third_party/media-tools/rubberband" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: dev-workspace/Models
          key: models-${{ hashFiles('core/ottosmasher/models/registry.py') }}
      - name: 模型权重
        run: .venv/Scripts/python.exe tools/fetch_models.py
      - name: Node 依赖
        run: tools/npm ci
      - name: mpv 渲染桥
        run: node tools/build-native.mjs
      - name: 类型与文案检查
        if: ${{ !inputs.spec }}
        run: |
          tools/npm run typecheck
          tools/npm run i18n:check
      - name: 前端单元测试
        if: ${{ !inputs.spec }}
        run: tools/npm test
      - name: 端到端测试
        env:
          SPEC: ${{ inputs.spec }}
        # 临时工作区放到能上传的位置，失败时带回任务日志
        run: |
          export TEMP="$(cygpath -w "$RUNNER_TEMP")" TMP="$(cygpath -w "$RUNNER_TEMP")"
          tools/npm run build
          if [ -n "$SPEC" ]; then export OTTO_HANG_DUMP_SECONDS=30; fi
          tools/npm exec -- playwright test $SPEC
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          # 只有合成数据（AGENTS §5）
          path: |
            .cache/playwright-results
            ${{ runner.temp }}/otto-*/**/Data/Logs/*
            ${{ runner.temp }}/otto-*/**/*.log
            ${{ runner.temp }}/otto-*/**/Data/Jobs/*/log.txt
          if-no-files-found: ignore
          retention-days: 14

  package:
    if: ${{ !inputs.spec }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Python 环境
        run: tools/uv sync --locked
      - name: 第三方文件
        run: .venv/Scripts/python.exe tools/fetch_third_party.py
      - name: pydomino 扩展
        run: tools/uv run --with setuptools python tools/build_domino.py
      - name: 媒体工具加入 PATH
        run: cygpath -w "$PWD/third_party/media-tools/ffmpeg/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: dev-workspace/Models
          key: models-${{ hashFiles('core/ottosmasher/models/registry.py') }}
      - name: 模型权重
        run: .venv/Scripts/python.exe tools/fetch_models.py
      - name: Node 依赖
        run: tools/npm ci
      - name: mpv 渲染桥
        run: node tools/build-native.mjs
      - name: 构建界面
        run: tools/npm run build
      - name: Electron 本体（第一次运行时才下载，打包要用）
        run: tools/npm exec -- node node_modules/electron/install.js
      - name: 打包
        run: |
          export UV_PYTHON_INSTALL_DIR="$PWD/.uv-python" UV_CACHE_DIR="$PWD/.uv-cache"
          .venv/Scripts/python.exe tools/package_win.py --skip-build
      - name: 发布包冒烟
        env:
          OTTO_PACKAGED_E2E: "1"
        run: tools/npm exec -- playwright test e2e/packaged.spec.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-package
          path: |
            out/release/*.zip
            out/release/*.sha256
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-results
          path: .cache/playwright-results
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 两个平台的工作流依次写同一个草稿，免得同时新建出两个
    concurrency:
      group: release-draft-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: release-files
      - run: tools/release_upload.sh "$GITHUB_REF_NAME" release-files
