# 编译 macOS arm64 的 libmpv（脚本里写明了版本和原因）。只在脚本或本文件变化时运行，产物是一个压缩包。
name: 编译 libmpv（macOS）

on:
  workflow_dispatch:
  push:
    paths:
      - tools/build_libmpv_macos.sh
      - .github/workflows/build-libmpv.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: 安装编译工具
        run: brew install meson ninja pkgconf
      - name: 编译
        run: sh tools/build_libmpv_macos.sh "$RUNNER_TEMP/libmpv-build"
      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-macos-arm64
          path: ${{ runner.temp }}/libmpv-build/libmpv-macos-arm64-*.tar.gz
          retention-days: 90
          if-no-files-found: error
