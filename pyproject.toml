[project]
name = "ottosmasher-core"
version = "0.1.5"
description = "OttoSmasher Core：领域、数据库、任务调度、检索协调"
requires-python = ">=3.12,<3.13"
dependencies = [
    "msgspec>=0.19",
    "numpy>=2.3",
    "onnxruntime==1.30.0 ; sys_platform != 'win32'",
    "onnxruntime-directml==1.24.4 ; sys_platform == 'win32'",
    "pyopenjtalk-plus[tsqyomi]==0.4.1.post9",
    "regex>=2025.9",
    "scipy>=1.16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/ottosmasher"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
pythonpath = ["core/tests"]
addopts = "-q"
