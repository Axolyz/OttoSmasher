<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OttoSmasher 界面原型 v3.1</title>
<style>
:root{
  --bg:#0e1014; --rail:#0b0d10; --s1:#14171c; --s2:#1a1e25; --s3:#222731; --line:#262b34; --line2:#1f242c;
  --text:#e7eaf0; --sub:#aab2bf; --muted:#7c8594; --faint:#555e6c;
  --accent:#8d7bff; --accent2:#b3a7ff; --accentbg:#8d7bff22;
  --wave:#4fc3c3; --wave2:#2c6f73; --prog:#8d7bff; --gold:#f2c14e;
  --sp:#6aa7ff; --pt:#f5b041; --up:#f07167; --un:#9aa4b2;
  --ok:#4cc38a; --warn:#e5a54b; --bad:#f06a6a;
  --r:10px; --shadow:0 18px 50px rgba(0,0,0,.55);
  --sel:#8d7bff1c;
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --rail:#e9ebf0; --s1:#ffffff; --s2:#f7f8fa; --s3:#eef0f4; --line:#e1e4ea; --line2:#eceef2;
  --text:#161a21; --sub:#3e4654; --muted:#6c7584; --faint:#a3abb8;
  --accentbg:#8d7bff1c; --wave:#2a9d9d; --wave2:#a9d6d6; --shadow:0 18px 50px rgba(20,25,40,.18); --sel:#8d7bff26;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans","Microsoft YaHei","Segoe UI",sans-serif;overflow:hidden;min-width:1180px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap;color:var(--sub)}
button:hover{border-color:var(--faint);color:var(--text)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{background:var(--accent2);border-color:var(--accent2)}
button.flat{border-color:transparent}
button.flat:hover{background:var(--s3)}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.muted{color:var(--muted)} .faint{color:var(--faint)} .sub{color:var(--sub)} .sm{font-size:12px} .xs{font-size:11px}
.row{display:flex;align-items:center;gap:8px} .col{display:flex;flex-direction:column} .grow{flex:1} .gap4{gap:4px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;color:var(--muted);min-width:18px;text-align:center;background:var(--s2)}
.info{display:inline-flex;width:15px;height:15px;border-radius:50%;border:1px solid var(--faint);color:var(--muted);font-size:10px;align-items:center;justify-content:center;cursor:help;font-style:normal}
.link{color:var(--accent2);cursor:pointer} .link:hover{text-decoration:underline}
::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px} ::-webkit-scrollbar-track{background:transparent}

/* ======== shell ======== */
#app{display:grid;grid-template-columns:68px 1fr;height:100vh}
#rail{background:var(--rail);border-right:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
#rail .logo{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 200deg,var(--accent),var(--wave),var(--pt),var(--accent));margin-bottom:14px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0b0d10}
.ri{width:56px;padding:7px 0 5px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);cursor:pointer;font-size:10.5px;position:relative;border:none}
.ri svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.ri:hover{color:var(--text);background:var(--s2)}
.ri.on{color:var(--text);background:var(--s3)}
.ri.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.ri .bdg{position:absolute;top:3px;right:9px;background:var(--accent);color:#fff;border-radius:8px;font-size:9.5px;padding:0 5px;line-height:15px}
#main{display:grid;grid-template-rows:54px 1fr 46px;min-width:0;min-height:0}
header.top{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line2)}
.ptitle{font-size:16px;font-weight:650;letter-spacing:.2px;margin-right:4px}
.tempo{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:3px 4px 3px 10px;cursor:text}
.tempo .q{color:var(--muted);font-size:15px}
.tempo input{width:58px;border:none;background:transparent;padding:2px 0;font-weight:650;font-size:14px;text-align:right}
.tempo .u{color:var(--muted);font-size:11px;margin-right:6px}
.cmdk{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:5px 10px;color:var(--muted);cursor:pointer;width:230px}
.cmdk:hover{border-color:var(--faint)}
.page{display:none;min-height:0;min-width:0} .page.on{display:flex}
/* dock */
#dock{border-top:1px solid var(--line2);display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--rail)}
.np{display:flex;align-items:center;gap:10px;min-width:0;width:44%}
.np .pp{width:30px;height:30px;border-radius:50%;border:none;background:var(--s3);color:var(--text);padding:0;display:flex;align-items:center;justify-content:center}
.np .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.np .ver{font-size:10.5px;border-radius:5px;padding:0 6px;border:1px solid var(--line);color:var(--sub)}
.np .ver.beat{border-color:var(--accent);color:var(--accent2)}
.np .bar{flex:1;height:3px;background:var(--line);border-radius:2px;position:relative;min-width:60px}
.np .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.notes{flex:1;display:flex;justify-content:flex-end;gap:8px;align-items:center;min-width:0}
.note{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:3px 6px 3px 10px;font-size:12px;max-width:520px}
.note .file{border:1px dashed var(--accent);color:var(--accent2);border-radius:6px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;cursor:grab}
.note button{padding:1px 8px;font-size:11.5px}

/* ======== library ======== */
#pg-library{flex-direction:column}
.lenses{display:flex;gap:2px}
.lens{border:none;border-radius:8px;padding:6px 12px;color:var(--muted);display:flex;align-items:center;gap:7px;font-weight:550}
.lens:hover{color:var(--text);background:var(--s2)}
.lens.on{color:var(--text);background:var(--s3)}
.lens .c{font-size:11px;color:var(--faint);font-weight:400}
.scope{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line2)}
.omni{flex:1;display:flex;align-items:center;flex-wrap:wrap;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:4px 6px;min-height:36px;position:relative}
.omni:focus-within{border-color:var(--accent)}
.preset{display:flex;align-items:center;gap:6px;border:none;border-right:1px solid var(--line);border-radius:0;padding:3px 10px 3px 6px;color:var(--sub)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--s3);border-radius:7px;padding:2px 3px 2px 9px;font-size:12px;white-space:nowrap}
.chip .k{color:var(--muted)}
.chip .x{border:none;padding:0 5px;color:var(--muted);border-radius:5px;line-height:18px}
.chip .x:hover{background:var(--line);color:var(--text)}
.chip.preset-chip{background:var(--accentbg);color:var(--accent2)}
.omni input.q{border:none;background:transparent;flex:1;min-width:160px;padding:4px 4px}
.expr{width:300px;background:var(--s1);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 8px;gap:6px;height:36px}
.expr:focus-within{border-color:var(--accent)}
.expr .lbl{color:var(--faint);font-size:11px}
.expr input{border:none;background:transparent;flex:1;padding:0;font-size:12px}
.expr.bad{border-color:var(--bad)}
.suggest{position:absolute;left:0;top:calc(100% + 6px);width:460px;background:var(--s2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30;display:none}
.suggest.on{display:block}
.suggest .g{font-size:10.5px;color:var(--faint);padding:6px 8px 2px;text-transform:uppercase;letter-spacing:.6px}
.suggest .it{padding:5px 8px;border-radius:7px;display:flex;justify-content:space-between;cursor:pointer}
.suggest .it:hover,.suggest .it.on{background:var(--s3)}

.lib{flex:1;display:flex;min-height:0}
.results{width:46%;min-width:440px;display:flex;flex-direction:column;border-right:1px solid var(--line2);position:relative;min-height:0}
.rhead{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 14px;border-bottom:1px solid var(--line2)}
.rtab{border:none;border-radius:7px;padding:4px 10px;color:var(--muted);display:flex;gap:6px;align-items:center;font-size:12.5px}
.rtab.on{background:var(--s3);color:var(--text)}
.rtab .x{opacity:.6;padding:0 2px}
.rtab .x:hover{opacity:1}
.hunt{border-color:var(--accent);color:var(--accent2)}
.rstat{padding:5px 14px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line2)}
.rstat .upd{color:var(--accent2);cursor:pointer}
.list{flex:1;overflow:auto;padding:4px 0 70px;outline:none}
.item{display:grid;grid-template-columns:22px 28px 1fr auto auto 22px;gap:10px;align-items:center;padding:7px 14px;cursor:default;user-select:none;border-left:2px solid transparent}
.item:hover{background:var(--s1)}
.item.focus{background:var(--s2);border-left-color:var(--accent)}
.item.ctx{box-shadow:inset 0 0 0 1px var(--accent)}
.item.dead{opacity:.45}
.ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:11px}
.ck.on{background:var(--accent);border-color:var(--accent)}
.pbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0;font-size:10px;color:var(--sub);background:var(--s1)}
.pbtn:hover{border-color:var(--accent);color:var(--text)}
.pbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pbtn.beat{border-color:var(--accent)}
.nm{font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:center}
.who{font-size:11.5px;color:var(--sub);white-space:nowrap}
.dur{font-size:12px;color:var(--muted);min-width:44px;text-align:right}
.star{cursor:pointer;color:var(--faint);font-size:14px;text-align:center}
.star.on{color:var(--gold)}
.glyph{display:inline-block;vertical-align:middle}
.hitline{grid-column:3/6;position:relative;height:16px;margin-top:2px}
.hitline .bg{position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line);border-radius:1px}
.hitline .h{position:absolute;top:2px;height:12px;border-radius:3px;background:var(--ok);opacity:.85;cursor:pointer}
.hitline .h.ap{background:var(--warn)}
.hitline .h.on{outline:2px solid var(--text);outline-offset:1px}
.hitline .lab{position:absolute;right:0;top:-1px;font-size:10.5px;color:var(--muted);background:var(--bg);padding-left:6px}
.hchips{grid-column:3/7;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.hc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:2px 8px 2px 3px;font-size:11.5px;background:var(--s1);cursor:pointer}
.hc.on{border-color:var(--accent);background:var(--accentbg)}
.hc .pbtn{width:22px;height:22px;font-size:9px}
.hc .ev{color:var(--ok)} .hc .ev.ap{color:var(--warn)}
.classify{display:flex;gap:4px}
.classify button{padding:1px 8px;font-size:11px;border-radius:6px}
.done{font-size:11.5px;color:var(--ok)}
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px 14px 80px}
.pad{background:var(--s1);border:1px solid var(--line2);border-radius:12px;padding:10px 10px 8px;position:relative;cursor:default;user-select:none;display:flex;flex-direction:column;gap:4px;min-height:118px}
.pad:hover{border-color:var(--line)}
.pad.focus{border-color:var(--accent);background:var(--s2)}
.pad .ck{position:absolute;top:9px;left:9px}
.pad .note{font-size:24px;font-weight:700;letter-spacing:.5px;margin-left:24px;line-height:1.1;background:none;border:none;padding:0}
.pad .pp{position:absolute;top:8px;right:8px}
.pad .nm{font-size:12px;font-weight:500}
.pad .star{position:absolute;bottom:7px;right:8px}
.floatbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:var(--s3);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px;box-shadow:var(--shadow);font-size:12.5px;z-index:5;white-space:nowrap}
.floatbar.on{display:flex}
.floatbar b{color:var(--accent2)}
.pager{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.pager button{padding:1px 7px}

/* composer */
.lib{position:relative}
.composer{position:absolute;left:0;right:0;top:0;background:var(--s1);border-bottom:1px solid var(--line);box-shadow:0 20px 40px rgba(0,0,0,.35);z-index:8;padding:12px 14px;display:none;flex-direction:column;gap:10px}
.composer.on{display:flex}
.composer .ttl{font-weight:650;font-size:14px}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:none;border-radius:7px;padding:3px 10px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--s3);color:var(--text)}
.cv{display:flex;gap:10px;min-height:0}
.canvas{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:10px;overflow:auto;position:relative}
.insp{width:230px;flex:none;background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px;font-size:12px;max-height:250px;overflow:auto}
.insp label{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--sub)}
.insp input,.insp select{width:96px;padding:2px 6px}
.roll{position:relative;height:120px}
.roll .gl{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.roll .gl.h{border-left:1px dashed var(--line2)}
.roll .bn{position:absolute;top:4px;font-size:10px;color:var(--faint)}
.blk{position:absolute;top:30px;height:60px;border-radius:9px;background:linear-gradient(180deg,var(--accent),#6a58e8);color:#fff;font-size:11px;padding:6px 8px;cursor:grab;user-select:none;overflow:hidden;box-shadow:0 4px 14px rgba(141,123,255,.25)}
.blk.sel{outline:2px solid #fff;outline-offset:1px}
.blk .rs{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(255,255,255,.18)}
.blk .bt{font-weight:700;font-size:13px;display:block}
.pr{position:relative}
.pr .keys{position:absolute;left:0;top:0;width:38px;border-right:1px solid var(--line2)}
.pr .k{height:10px;font-size:8.5px;line-height:10px;padding-left:4px;color:var(--faint)}
.pr .k.b{background:var(--s2)}
.pr .grid{position:absolute;left:38px;right:0;top:0;bottom:0}
.pb{position:absolute;border-radius:5px;background:linear-gradient(180deg,var(--pt),#d48a1c);color:#1b1407;font-size:10.5px;font-weight:650;padding:0 6px;cursor:grab;user-select:none;overflow:hidden;white-space:nowrap}
.pb.sel{outline:2px solid #fff;outline-offset:1px}
.pb .rs{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize;background:rgba(0,0,0,.15)}
.err{color:var(--bad);font-size:12px}
.okm{color:var(--ok);font-size:12px}

/* stage */
.stage{flex:1;min-width:460px;overflow:auto;display:flex;flex-direction:column}
.hero{display:flex;gap:16px;padding:18px 20px 10px;align-items:flex-start}
.poster{width:176px;height:99px;border-radius:10px;background:radial-gradient(120% 120% at 20% 10%,#3b4b6b,#151a22);flex:none;position:relative;overflow:hidden;cursor:pointer}
.poster::after{content:"同步画面";position:absolute;right:8px;bottom:6px;font-size:10px;color:#cdd3de;opacity:.8}
.htitle{font-size:22px;font-weight:700;line-height:1.25;outline:none;border-radius:6px}
.htitle:focus{background:var(--s2)}
.hsub{color:var(--sub);margin-top:2px}
.hmeta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted);align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:1px 9px;font-size:11.5px;border:1px solid var(--line)}
.tagline{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tg{font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--s2);color:var(--sub);cursor:pointer;white-space:nowrap}
.tg .fc{color:var(--faint);margin-right:4px}
.tg .x{margin-left:4px;color:var(--muted)}
.tg.add{border:1px dashed var(--line);background:transparent;color:var(--muted)}
.hitnav{margin:0 20px 6px;display:flex;align-items:center;gap:10px;font-size:12px;background:var(--accentbg);border-radius:9px;padding:5px 10px}
.wavecard{margin:6px 20px 0;background:var(--s1);border:1px solid var(--line2);border-radius:14px;padding:10px 12px 8px;outline:none}
.wavecard.focusscope{border-color:var(--accent)}
.wavehead{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px}
.srcbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:2px 9px;color:var(--sub);cursor:pointer;background:var(--s2)}
.wv{position:relative}
.wv .ws{position:relative}
.wv canvas.ov{position:absolute;left:0;top:0;pointer-events:none}
.lanes{position:relative;height:40px;margin-top:2px}
.lanes canvas{position:absolute;left:0;top:0}
.strip{display:flex;align-items:center;gap:8px;margin:8px 20px 0;flex-wrap:wrap}
.strip .tp{display:flex;gap:6px}
.big{padding:7px 14px;border-radius:10px;font-weight:600}
.big.o{background:var(--s3);border-color:var(--s3);color:var(--text)}
.big.b{border-color:var(--accent);color:var(--accent2)}
.selbox{display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:3px 8px}
.selbox input{width:74px;border:none;background:transparent;padding:2px;text-align:right}
.acts{display:flex;gap:2px;background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:3px}
.acts button{border:none;border-radius:7px;padding:4px 10px;color:var(--sub);font-weight:550}
.acts button:hover{background:var(--s3);color:var(--text)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px 24px}
.card{background:var(--s1);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.wide{grid-column:1/3}
.card h5{margin:0;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.card h5 .grow{flex:1}
.phs{display:flex;flex-wrap:wrap;gap:4px}
.ph{font-size:12px;padding:1px 7px;border-radius:6px;background:var(--s2);cursor:pointer}
.ph.v{background:var(--accentbg);color:var(--accent2)}
.bignote{font-size:40px;font-weight:750;letter-spacing:.5px;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px}
.kv>:nth-child(odd){color:var(--muted)}
.fold{border-top:1px solid var(--line2);margin:0 20px;padding:10px 0}
.fold summary{cursor:pointer;color:var(--sub);font-weight:600;list-style:none}
.fold summary::before{content:"▸ ";color:var(--muted)}
.fold[open] summary::before{content:"▾ "}
.natseg button{font-size:12px}
.triage{margin:12px 20px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tri{border-radius:12px;padding:14px 10px;text-align:center;font-weight:650;border:1px solid var(--line);cursor:pointer;background:var(--s1)}
.tri:hover{transform:translateY(-1px)}
.tri .kbd{margin-top:6px}
.tri.sp{border-color:var(--sp);color:var(--sp)} .tri.pt{border-color:var(--pt);color:var(--pt)} .tri.up{border-color:var(--up);color:var(--up)}
.empty{margin:auto;text-align:center;color:var(--muted);padding:40px}

/* ======== sources ======== */
#pg-sources{flex-direction:column}
.viewer{flex:1;display:grid;grid-template-columns:1fr 360px;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.vid{background:#000;margin:14px 0 0 16px;border-radius:14px;position:relative;overflow:hidden;min-height:0;cursor:pointer}
.vid .art{position:absolute;inset:0;background:radial-gradient(90% 90% at 30% 20%,#2a3550,#07090c);display:flex;align-items:center;justify-content:center;color:#5d6a80;font-size:12px}
.vid .subt{position:absolute;left:0;right:0;bottom:44px;text-align:center;color:#fff;font-size:20px;text-shadow:0 0 4px #000,0 0 4px #000,0 0 2px #000;white-space:pre-line;padding:0 20px}
.vid .vc{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#ddd;font-size:12px}
.transcript{margin:14px 16px 0 14px;background:var(--s1);border:1px solid var(--line2);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.transcript .th{padding:10px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.tl{overflow:auto;flex:1;padding:6px 0}
.line{display:grid;grid-template-columns:56px 60px 1fr;gap:8px;padding:5px 14px;cursor:pointer;font-size:13px;border-left:2px solid transparent}
.line:hover{background:var(--s2)}
.line.cur{border-left-color:var(--accent);background:var(--s2)}
.line.sel{background:var(--accentbg)}
.line .t{color:var(--faint);font-size:11px;padding-top:2px}
.line .spk{color:var(--sp);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line.sfx .tx{color:var(--muted);font-style:italic}
.opblk{margin:6px 14px;border:1px dashed var(--line);border-radius:9px;padding:6px 10px;color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center}
.timeline{grid-column:1/3;margin:12px 16px 10px;background:var(--s1);border:1px solid var(--line2);border-radius:14px;padding:10px 12px}
.prepbar{display:flex;gap:4px;align-items:center}
.prepbar i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.prepbar i.ok{background:var(--ok)}
.pop{position:fixed;z-index:60;background:var(--s2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:none;min-width:320px}
.pop.on{display:block}
.chk{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 6px;border-radius:9px}
.chk:hover{background:var(--s3)}
.chk .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;font-size:11px}
.chk .st.ok{background:var(--ok);border-color:var(--ok);color:#06210f}
.chk .d{font-size:11.5px;color:var(--muted)}
.shelf{flex:1;overflow:auto;padding:16px 20px 80px;position:relative}
.wg{margin-bottom:22px}
.wg h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:10px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ep{background:var(--s1);border:1px solid var(--line2);border-radius:14px;overflow:hidden;cursor:default;position:relative;user-select:none}
.ep.focus{border-color:var(--accent)}
.ep .pv{height:104px;background:radial-gradient(120% 120% at 20% 10%,#34425f,#11151c);display:flex;align-items:flex-end;padding:8px 10px;font-size:26px;font-weight:800;color:#e6ebf5}
.ep .ck{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.35)}
.ep .bd{padding:8px 10px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted)}
.ep .prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.ep .prog i{display:block;height:100%;background:var(--ok)}
.ep.add{display:flex;align-items:center;justify-content:center;border-style:dashed;color:var(--muted);min-height:170px;cursor:pointer}

/* ======== sheets / modals / menus ======== */
#veil{position:fixed;inset:0;background:rgba(5,7,10,.55);display:none;z-index:40}
#veil.on{display:block}
.sheet{position:fixed;left:68px;right:0;bottom:0;top:54px;background:var(--bg);z-index:45;transform:translateY(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sheet.on{transform:none}
.sheet .sh{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line2)}
.sheet .sh h2{margin:0;font-size:17px}
.sheet .sb{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 320px;gap:16px;padding:16px 20px}
.sheet .sf{border-top:1px solid var(--line2);padding:10px 20px;display:flex;gap:10px;align-items:center}
.opt{display:flex;flex-direction:column;gap:6px}
.opt .ot{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--s1)}
.choice.on{border-color:var(--accent);background:var(--accentbg)}
.choice b{display:block;font-size:13px}
.choice span{font-size:11.5px;color:var(--muted)}
.modal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:560px;max-width:92vw;background:var(--s1);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:50;display:none;flex-direction:column;max-height:76vh}
.modal.on{display:flex}
.modal .mh{padding:16px 18px 6px}
.modal .mh h3{margin:0;font-size:16px}
.modal .mb{padding:6px 18px 12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end}
.say{background:var(--s2);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--sub)}
.say b{color:var(--text)}
.big3{display:flex;gap:10px}
.big3 div{flex:1;background:var(--s2);border-radius:12px;padding:10px 12px}
.big3 .n{font-size:26px;font-weight:750}
.big3 .l{font-size:11.5px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--line2)}
.tbl tr.dis td{color:var(--faint)}
.st-ok{color:var(--ok)} .st-w{color:var(--warn)} .st-b{color:var(--bad)}
.menu{position:fixed;z-index:70;background:var(--s2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;min-width:250px;display:none;font-size:12.5px}
.menu.on{display:block}
.menu .mhd{padding:6px 10px 7px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line2);margin-bottom:4px}
.menu .mhd b{color:var(--text)}
.menu .mi{padding:6px 10px;border-radius:8px;display:flex;justify-content:space-between;gap:20px;cursor:pointer;color:var(--sub)}
.menu .mi:hover{background:var(--s3);color:var(--text)}
.menu .mi .k{color:var(--faint)}
.menu .sep{height:1px;background:var(--line2);margin:4px 2px}
#drawer{position:fixed;right:0;top:0;bottom:0;width:440px;background:var(--s1);border-left:1px solid var(--line);z-index:55;transform:translateX(102%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#drawer.on{transform:none}
.job{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:6px;font-size:12px}
.job .pb2{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.job .pb2 i{display:block;height:100%;background:var(--accent)}
#palette{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:600px;background:var(--s2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:80;display:none;flex-direction:column;overflow:hidden}
#palette.on{display:flex}
#palette input{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:16px;background:transparent}
#palette .pl{max-height:360px;overflow:auto;padding:6px}
#palette .pi{padding:8px 12px;border-radius:9px;display:flex;justify-content:space-between;cursor:pointer;color:var(--sub)}
#palette .pi.on{background:var(--s3);color:var(--text)}
#toasts{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:90;align-items:center;pointer-events:none}
.toast{background:var(--s3);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 12px;font-size:12.5px;box-shadow:var(--shadow);pointer-events:auto;display:flex;gap:10px;align-items:center}
.toast button{padding:1px 8px;font-size:11.5px}
#help{position:fixed;inset:0;background:rgba(5,7,10,.6);display:none;z-index:95;align-items:center;justify-content:center}
#help.on{display:flex}
#help .c{background:var(--s1);border:1px solid var(--line);border-radius:16px;width:900px;max-height:84vh;overflow:auto;padding:18px 22px;columns:2;column-gap:28px}
#help h4{margin:10px 0 6px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;break-after:avoid}
#help .r{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--line2);break-inside:avoid}
.settings{display:grid;grid-template-columns:180px 1fr;gap:18px;padding:16px 20px;flex:1;overflow:auto}
.settings nav{display:flex;flex-direction:column;gap:2px}
.settings nav div{padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--sub)}
.settings nav div.on{background:var(--s3);color:var(--text)}
.si{display:grid;grid-template-columns:220px 1fr;gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:center}
.si .e{grid-column:2;font-size:11.5px;color:var(--muted)}
.tools{flex:1;display:grid;grid-template-columns:300px 1fr 340px;gap:14px;padding:16px 20px}
.tools .card pre{font-size:11.5px;background:var(--bg);border-radius:9px;padding:10px;white-space:pre-wrap;margin:0}
.ver{position:fixed;right:12px;bottom:52px;font-size:10.5px;color:var(--faint);z-index:3}

/* ===== v3 ===== */
.item{grid-template-columns:22px 92px 1fr auto auto 22px;padding:6px 14px}
.th{width:88px;height:50px;border-radius:7px;position:relative;flex:none;overflow:hidden}
.th::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.35))}
.th .pbtn{position:absolute;left:5px;bottom:5px;width:24px;height:24px;font-size:9px;z-index:1;background:rgba(0,0,0,.55);border-color:transparent;color:#fff}
.th .pbtn.on{background:var(--accent)}
.th.sm{width:56px;height:32px}
.pn{font-weight:700;font-size:13px}
.hero{gap:18px;padding:16px 20px 8px}
.hero .poster{width:400px;height:225px;border-radius:12px}
.hero.bigv{flex-direction:column}
.hero.bigv .poster{width:100%;height:auto;aspect-ratio:16/9;max-height:440px}
.poster .vsz{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.45);color:#fff;border:none;padding:2px 8px;z-index:2}
.hinfo .htitle{font-size:21px}
.hinfo .hitnav{margin:10px 0 0}
.layerbar{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.layerbar .seg button{font-size:11.5px;padding:2px 9px}
.layerbar .seg button:disabled{opacity:.35}
.lanechk{display:flex;align-items:center;gap:3px;color:var(--sub)}
.editbar{display:none;align-items:center;gap:10px;font-size:12px;background:var(--accentbg);border:1px solid var(--accent);border-radius:9px;padding:4px 6px 4px 10px;margin-bottom:6px}
.editing .editbar{display:flex}
.editing .editbtn{display:none}
.lanes{position:relative;margin-top:2px;cursor:default}
.panels{display:grid;grid-template-columns:1fr;gap:12px;padding:14px 20px 20px}
.moras{display:flex;flex-wrap:wrap;gap:10px}
.mora{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 6px;border-radius:8px;background:var(--s2)}
.mora .kana{font-size:15px;font-weight:650}
details.mini{position:relative}
details.mini summary{cursor:pointer;color:var(--sub);font-size:12px;list-style:none;border:1px solid var(--line);border-radius:7px;padding:2px 8px}
details.mini[open] summary{border-color:var(--accent)}
details.mini>.pane{position:absolute;right:0;top:calc(100% + 6px);z-index:6;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:var(--shadow);min-width:260px}
.mid{font-size:18px;font-weight:650;white-space:nowrap}
#pg-sources{flex-direction:row}
.viewer{flex:1;min-width:0}
.srclist{width:290px;flex:none;border-right:1px solid var(--line2);display:flex;flex-direction:column;position:relative;min-height:0}
.srclist .sl{overflow:auto;flex:1;padding-bottom:60px}
.srclist .sg{font-size:11px;letter-spacing:.6px;color:var(--faint);padding:10px 14px 4px;text-transform:uppercase}
.srow{display:grid;grid-template-columns:20px 56px 1fr;gap:9px;align-items:center;padding:6px 12px;border-left:2px solid transparent;user-select:none}
.srow:hover{background:var(--s1)}
.srow.focus{background:var(--s2);border-left-color:var(--accent)}
.srow.ctx{box-shadow:inset 0 0 0 1px var(--accent)}
.srow .prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}
.srow .prog i{display:block;height:100%;background:var(--ok)}
.transcript .th2{padding:10px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}

.scope{gap:10px}
.scopebox{background:color-mix(in srgb,var(--accent) 7%,var(--s1));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.zl{font-size:10.5px;letter-spacing:.6px;color:var(--faint);padding:0 6px 0 4px;white-space:nowrap}
.scopebox .zl{color:var(--accent2)}
.mod{font-size:11.5px;color:var(--warn);white-space:nowrap}
.chip.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11.5px}
.findbox{flex:1.1;display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:0 8px;min-height:36px}
.findbox:focus-within{border-color:var(--accent)}
.findbox.bad{border-color:var(--bad)}
.findbox input{border:none;background:transparent;padding:4px 2px;min-width:0}
.findbox #textIn{flex:1}
.findbox #expr{flex:1.2;font-size:12px}
.findbox .lbl{color:var(--faint);font-size:11px;white-space:nowrap}
.vsep{width:1px;height:18px;background:var(--line)}
.relbanner{grid-column:1/3;margin:12px 16px 0;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--s1));border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--sub)}
.srclist .sg.sec{margin-top:10px;border-top:1px solid var(--line2);padding-top:12px;display:flex;align-items:center;gap:6px}
.viewer:has(.relbanner){grid-template-rows:auto minmax(0,1fr) auto}

/* ===== v3.1：查找栏在列表正上方、范围收成一行、长名称 ===== */
.lib{display:flex}
.rcol{width:var(--lw,50%);min-width:420px;flex:none;display:flex;flex-direction:column;min-height:0;position:relative}
.rcol .results{width:auto;min-width:0;flex:1;border-right:none}
.split{width:5px;flex:none;cursor:col-resize;border-left:1px solid var(--line2);margin-right:-4px;z-index:2}
.split:hover{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.findbar{display:flex;align-items:center;gap:6px;padding:9px 12px 6px}
.findbar .findbox{flex:1;min-height:36px}
.findbox #textIn{flex:1;font-size:13.5px}
.findbox #expr{flex:1;font-size:12px}
.startg{font-size:15px;color:var(--faint);padding:4px 9px}
.startg.on{color:var(--gold);background:var(--s2)}
.scopeline{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:2px 12px 7px;font-size:11.5px;position:relative;border-bottom:1px solid var(--line2)}
.scopeline .zl{padding:0 2px 0 0;color:var(--accent2)}
.scopeline .preset{border:none;padding:1px 6px;font-size:11.5px;color:var(--sub);border-radius:6px}
.scopeline .preset:hover{background:var(--s2)}
.scopeline .chip{font-size:11px;background:transparent;border:1px solid var(--line);padding:0 1px 0 7px;border-radius:6px}
.scopeline .chip .x{line-height:16px}
.scopeline input.q{border:none;background:transparent;padding:1px 4px;font-size:11.5px;min-width:60px;flex:1;max-width:240px}
.scopeline .suggest{top:calc(100% + 2px)}
.item{grid-template-columns:22px 92px minmax(0,1fr) 22px;align-items:start;padding:7px 14px}
.item .ck{margin-top:17px}.item .star{margin-top:14px}
.item .body{min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center;min-height:50px}
.nm2{font-weight:560;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.nm2 .dot{margin-right:7px;vertical-align:2px}
.item .meta .who{font-size:11.5px}
.item .meta .dur{min-width:0}
.hitline{grid-column:3/4}.hchips{grid-column:3/5}
.htitle.long{font-size:17px;line-height:1.4}
.htitle{word-break:break-word}
.srclbl{font-size:12px;color:var(--sub);border:1px solid var(--line2);border-radius:7px;padding:2px 8px}
.titlerow{padding:14px 20px 0}
.titlerow>.row{align-items:flex-start;gap:8px}
.titlerow .htitle{flex:1;min-width:0}
.titlerow .grow{display:none}
.hero{padding-top:10px}
</style>

const FACETS={作品:WORKS,类型:["动画"],人物:[...CH["Yuru Yuri"],...CH["Kemono Friends"]],音高:NOTES,其他:["好用","尖叫","speaker-status:多人未分段"]};

function bindScope(){
  const inp=$("#omniIn"),sg=$("#suggest");

    Object.entries(FACETS).forEach(([f,vals])=>{const m=vals.filter(v=>!q||v.includes(q)||f.includes(q));if(m.length)h+=`<div class="g">${f}</div>`+m.slice(0,5).map(v=>`<div class="it" data-f="${f}" data-v="${esc(v)}"><span>${esc(v)}</span><span class="faint">${countFor(f,v)}</span></div>`).join("")});
    h+=`<div class="g">高级</div><div class="it" data-rexpr><span>标签表达式…（只含标签；与查找栏的表达式分开，存进筛选器）</span></div><div class="faint xs" style="padding:6px 8px">筛选器只放标签。文字、星标在上面的查找栏里，不存进筛选器</div>`;

  $$("[data-rm]").forEach(b=>b.onclick=()=>{S.chips.splice(+b.dataset.rm,1);changed()});
  $("#pUpd")&&($("#pUpd").onclick=()=>{PRESETS.find(x=>x.id===S.preset).conds=S.chips.map(c=>[...c]);renderLibrary();toast("已更新筛选器（可撤销）",{undo:"更新筛选器"})});

  const ti=$("#textIn");ti.oninput=()=>{clearTimeout(window._tx);window._tx=setTimeout(()=>{S.text=ti.value.trim();changed(true)},180)};

function countFor(f,v){return samples.filter(s=>matchChip(s,[f,v])).length}
function matchChip(s,[f,v]){if(f==="作品")return s.work===v;if(f==="类型")return true;if(f==="人物")return s.who&&s.who.includes(v);if(f==="音高")return s.pitch===v;if(f==="其他")return s.local.includes(v)||(v.startsWith("speaker")&&s.multi);if(f==="星标")return s.starred;if(f==="性质")return NAT[s.nature]===v;if(f==="原片")return v.startsWith(s.work)&&v.includes(s.ep);if(f==="文字")return s.name.includes(v)||s.reading.includes(v);if(f==="标签表达式"){try{const fn=parseExpr(v);return !fn||fn(tagsOf(s))}catch(e){return true}}return true}
function tagsOf(s){const t=["work:"+s.work,"type:动画"];if(s.who){if(s.multi)s.who.split("、").forEach(w=>t.push("participants:"+w)),t.push("speaker-status:多人未分段");else t.push("character:"+s.who)}if(s.pitch)t.push("pitch:"+s.pitch);return t.concat(s.local)}
function filtered(){let fn=null;try{fn=S.expr?parseExpr(S.expr):null}catch(e){}
  return samples.filter(s=>{const nat=S.classified[s.id]?S.classified[s.id].from:s.nature;if(S.lens!=="all"&&nat!==S.lens)return false;if(S.starOnly&&!s.starred)return false;
    if(S.text&&!(s.name.includes(S.text)||s.reading.includes(S.text)))return false;
    if(!S.chips.every(c=>matchChip(s,c)))return false;if(fn&&!fn(tagsOf(s)))return false;return true})}

/* ---------- 表达式解析（与 v1 相同语义） ---------- */
function tokenize(s){const o=[];let i=0;while(i<s.length){const c=s[i];if(/\s/.test(c)){i++;continue}if(c==="("||c===")"){o.push({t:c,p:i});i++;continue}if(c==='"'){let j=i+1,v="";while(j<s.length&&s[j]!=='"')v+=s[j++];if(j>=s.length)throw{p:i,m:"引号没有闭合"};if(!v)throw{p:i,m:"空的引号"};o.push({t:"tag",v,p:i});i=j+1;continue}let j=i,v="";while(j<s.length&&!/[\s()"]/.test(s[j]))v+=s[j++];const u=v.toUpperCase();o.push(u==="AND"||u==="OR"||u==="NOT"?{t:u,p:i}:{t:"tag",v,p:i});i=j}return o}
function parseExpr(s){const T=tokenize(s);let k=0;const pk=()=>T[k],pos=()=>T[k]?T[k].p:s.length;
  const or=()=>{let l=and();while(pk()&&pk().t==="OR"){k++;const r=and(),L=l;l=x=>L(x)||r(x)}return l};
  const and=()=>{let l=not();while(pk()&&pk().t==="AND"){k++;const r=not(),L=l;l=x=>L(x)&&r(x)}if(pk()&&["tag","NOT","("].includes(pk().t))throw{p:pos(),m:"需要 AND 或 OR"};return l};
  const not=()=>{if(pk()&&pk().t==="NOT"){k++;const e=not();return x=>!e(x)}return atom()};

addEventListener("keydown",e=>{const mod=e.metaKey||e.ctrlKey,inI=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable;

    {const we=[stageWave,srcWave].find(x=>x&&x.editing);if(we){we.L[we.overlay]=we._backup;we.toggleEdit(false);return toast("已退出编辑（未保存的修改已放弃）")}}if(S.page==="library"&&S.composer){S.composer=false;return renderResults()}if(S.page==="library"&&S.checked.size){const n=S.checked.size;S.checked.clear();renderResults();return toast(`已清空 ${n} 项勾选`)}if(S.page==="sources"&&S.src.checked.size){S.src.checked.clear();renderSources()}return}
  if($("#modal").classList.contains("on")||$("#palette").classList.contains("on"))return;
  if(mod&&["1","2","3"].includes(e.key)){e.preventDefault();return go(["library","sources","tools"][+e.key-1])}
  if(mod&&e.key===","){e.preventDefault();return settingsSheet()}if(mod&&e.key.toLowerCase()==="j"){e.preventDefault();return $("#drawer").classList.toggle("on")}
  if(mod&&e.key.toLowerCase()==="f"){e.preventDefault();return (e.shiftKey?$("#omniIn"):$("#textIn"))?.focus()}
  if(mod&&e.key==="Enter"&&S.composer){e.preventDefault();return runSearch()}
  if(inI)return;if(mod&&e.key.toLowerCase()==="z"){e.preventDefault();return undo()}if(e.key==="?")return showHelp();

  if(S.page==="library"&&S.scope==="list"){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const n=moveFocus(e.key==="ArrowDown"?1:-1);if(n){if(e.shiftKey)S.checked.add(n);focus(n);$(`#list [data-id="${n}"]`)?.scrollIntoView({block:"nearest"})}return}
    if(!S.focus)return;
    if(e.key===" "){e.preventDefault();return play(S.focusHit||S.focus,"orig")}if(e.key.toLowerCase()==="b")return play(S.focusHit||S.focus,"beat");
    if(e.key.toLowerCase()==="x"){toggleCk(S.focus);S.anchor=S.focus;return}if(mod&&e.key.toLowerCase()==="a"){e.preventDefault();rows().forEach(r=>!r.s.dead&&S.checked.add(r.s.id));renderResults();return toast(`已勾选全部 ${S.checked.size} 个匹配`)}
    if(e.key.toLowerCase()==="s")return star(S.focus);if(["1","2","3","0"].includes(e.key))return classify(S.checked.size?[...S.checked]:[S.focus],{"1":"speech","2":"pitched","3":"unpitched","0":"unclassified"}[e.key]);
    if(e.key==="F2")return $(".htitle")?.focus();if(e.key==="Enter"){if(S.focusHit)return locate(S.focusHit);setScope("stage");return toast("焦点移到波形")}
    if(e.key==="Delete"||e.key==="Backspace")return delModal(S.checked.size?[...S.checked]:[S.focus])}
  if(w){const fr=1/23.976;if(e.key===" "){e.preventDefault();return e.shiftKey?w.playSel():w.toggle()}if(e.key.toLowerCase()==="i")return w.setIn();if(e.key.toLowerCase()==="o")return w.setOut();

}
  if(S.scope==="canvas"){if(e.key==="Delete"||e.key==="Backspace"){if(S.cmode==="speech"){S.sp.blocks=S.sp.blocks.filter(b=>b.id!==S.sp.sel);S.sp.sel=null;drawRoll()}else delPitch();return}
